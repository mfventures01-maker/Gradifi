name: Gradifi Verify Commercial MVP - HOEOS Gates

on:
  push:
    branches:
      - sprint/verify-commercial-mvp-10h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-commercial-mvp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: G0 Baseline - Typecheck, Unit Tests, Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout sprint branch with full history for safe rebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile lockfile for security-patched XML parser
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Capture dependency audit
        run: |
          mkdir -p test-results
          npm audit --json > test-results/npm-audit-before-fix.json || true
          npm audit --omit=dev --json > test-results/npm-audit-production-before-fix.json || true

      - name: Apply non-breaking dependency security fixes
        run: |
          npm audit fix || true
          npm audit --json > test-results/npm-audit-after-fix.json || true
          npm audit --omit=dev --json > test-results/npm-audit-production-after-fix.json || true
          cp package-lock.json test-results/package-lock-after-audit-fix.json

      - name: Reinstall from security-patched lockfile
        run: npm ci

      - name: Enforce production dependency audit gate
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build server runtime imports
        run: npm run build:server

      - name: Client and server typecheck
        run: npm run typecheck

      - name: Vitest suite
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Standalone HOEOS assertion suites
        run: npm run test:hoeos-scripts

      - name: Production build
        run: npm run build

      - name: Commit validated non-breaking lockfile fixes
        if: success()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): apply validated non-breaking npm audit fixes"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-g0-test-report
          path: |
            test-results/vitest-junit.xml
            test-results/npm-audit-before-fix.json
            test-results/npm-audit-production-before-fix.json
            test-results/npm-audit-after-fix.json
            test-results/npm-audit-production-after-fix.json
            test-results/package-lock-after-audit-fix.json
          if-no-files-found: ignore
          retention-days: 14

  docx-browser:
    name: G1/G5 DOCX and PDF Browser Golden Paths
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFY_ISOLATED_SUPABASE_URL: ${{ secrets.VERIFY_ISOLATED_SUPABASE_URL }}
      VERIFY_ISOLATED_SUPABASE_ANON_KEY: ${{ secrets.VERIFY_ISOLATED_SUPABASE_ANON_KEY }}
      VERIFY_ISOLATED_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VERIFY_ISOLATED_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.VERIFY_ISOLATED_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VERIFY_ISOLATED_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VERIFY_ISOLATED_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VERIFY_ISOLATED_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout validated sprint branch head
        uses: actions/checkout@v4
        with:
          ref: sprint/verify-commercial-mvp-10h

      - name: Refuse production Supabase target
        run: |
          if [[ -n "$VERIFY_ISOLATED_SUPABASE_URL" && "$VERIFY_ISOLATED_SUPABASE_URL" == *"ehkmfnaqkdgkjmdxxbwj"* ]]; then
            echo "Refusing to run persistence tests against the production Supabase project."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real DOCX and PDF browser verification
        run: npx playwright test e2e/g1-docx-browser-acceptance.spec.ts e2e/golden-path-demo-e2e.spec.ts e2e/four-gates-g4-browser.spec.ts --reporter=line --retries=0

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-g1-docx-browser-evidence
          path: |
            tests/hoeos/g2/evidence/g1_browser/
            tests/hoeos/four_gates/evidence/
            test-results/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
