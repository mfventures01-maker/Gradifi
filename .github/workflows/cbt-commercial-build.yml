name: CBT Commercial Build

on:
  pull_request:
    branches: [clean-deploy]
  push:
    branches: [cbt/commercial-e2e, cbt/commercial-schema-remediation-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check CBT implementation
        run: npx tsc -p tsconfig.cbt.json --noEmit
      - name: Run contract and regression tests
        run: npx vitest run tests/cbtCommercialContract.test.ts
      - name: Build server and frontend
        run: npm run build
