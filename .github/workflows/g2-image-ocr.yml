name: G2 Image OCR Verification

on:
  push:
    branches:
      - fix/g2-image-ocr-ingestion
  pull_request:
    branches:
      - main

jobs:
  image-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ''
      - name: Install deterministic OCR font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-liberation
          fc-cache --force
          fc-match "Liberation Sans"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run mocked OCR regression tests
        run: npx vitest run tests/g2_image_universal_ingestion.test.ts tests/ocrService.lifecycle.test.ts
      - name: Run real JPEG and PNG OCR through production ingestion
        run: npx tsx tests/g2_real_image_ocr_runtime.test.ts
      - name: Upload real OCR certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-real-image-ocr-runtime-report
          path: g2-image-ocr-runtime-report.json
          if-no-files-found: warn
      - name: Repository-wide typecheck (known unrelated runtime import blockers)
        run: npm run typecheck
        continue-on-error: true
