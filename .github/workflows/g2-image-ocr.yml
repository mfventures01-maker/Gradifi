name: G2 Image OCR Verification

on:
  push:
    branches:
      - fix/g2-image-ocr-ingestion
  pull_request:
    branches:
      - main

jobs:
  image-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run image OCR regression tests
        run: npx vitest run tests/g2_image_universal_ingestion.test.ts tests/ocrService.lifecycle.test.ts
