name: G4-C Production Finding Coordinate Integrity

on:
  push:
    branches:
      - fix/g2-image-ocr-ingestion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g4c-coordinate-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: G4-C production finding coordinate integrity
        run: npx vitest run tests/g4d_persisted_evidence_integrity.test.ts tests/verificationPersistence.test.ts tests/g4c_production_finding_coordinate_integrity.test.ts tests/g4b_canonical_source_alignment.test.ts tests/g3_deterministic_forensic_e2e.test.ts
