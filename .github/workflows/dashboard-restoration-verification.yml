name: Dashboard restoration verification

on:
  push:
    branches:
      - fix/restore-authenticated-school-and-higher-ed-dashboards-2026-11-16
  pull_request:
    branches:
      - fix/wp0-rector-onboarding-contract-baseline-2026-11-16

permissions:
  contents: read

jobs:
  build-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: TypeScript validation
        if: always()
        run: npm run lint
