name: HOEOS Integration Workspace Checks

on:
  push:
    branches:
      - integration/verify-workspace-2026-11-17
      - reconcile/g0-g1-browser-proof-2026-11-18
  pull_request:
    branches:
      - integration/verify-workspace-2026-11-17
      - reconcile/ho-eos-unified-integration-2026-11-18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: G3 forensic E2E (four deterministic proofs)
        run: npx vitest run tests/g3_deterministic_forensic_e2e.test.ts --reporter=verbose

      - name: Build server runtime
        run: npm run build:server

      - name: Client and server type checks
        run: npm run typecheck

      - name: G1 DOCX Vitest discovery and focused integration regressions
        run: >-
          npx vitest run
          tests/g1_docx_fidelity.test.ts
          tests/g4d_persisted_evidence_integrity.test.ts
          tests/verifyPersistenceAuthorization.test.ts
          tests/trustedCorrectionComparison.test.ts
          tests/publicReceiptPrivacy.test.ts
          --reporter=verbose

      - name: Install Chromium for G4-D browser runtime
        run: npx playwright install --with-deps chromium

      - name: G4-D browser payload runtime (API endpoint intercepted)
        run: npx playwright test --config=playwright.g4d.config.ts

      - name: G1 real-browser DOCX ingestion proof
        run: npx playwright test --config=playwright.g1.config.ts

      - name: Production build
        run: npm run build

  g3-certification:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete 17-gate G3 certification
        shell: pwsh
        run: ./scripts/hoeos/verifyG3Certification.ps1
