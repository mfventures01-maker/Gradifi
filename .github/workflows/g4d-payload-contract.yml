name: G4-D Browser Payload Contract

on:
  pull_request:
    branches:
      - fix/g2-image-ocr-ingestion
    paths:
      - "src/pages/verify/GradifiVerifyDemoPage.tsx"
      - "src/services/verify/g4dPersistencePayload.ts"
      - "src/services/verify/types.ts"
      - "src/services/verify/verificationPersistenceService.ts"
      - "src/services/verify/verificationPersistenceIntegrity.ts"
      - "src/services/verify/server/persistenceServerHandler.ts"
      - "tests/g4d_persisted_evidence_integrity.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/g4d-payload-contract.yml"
  workflow_dispatch:

jobs:
  g4d-payload-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: G4-D payload and integrity regression
        run: npx vitest run tests/g4d_persisted_evidence_integrity.test.ts --reporter=verbose
