name: CMVP live trial Edge Function canary

on:
  push:
    branches:
      - fix/cmvp01-public-commercial-gate-2026-11-22
    paths:
      - scripts/verify-cmvp-trial-edge.ps1
      - .github/workflows/cmvp-live-trial-edge-canary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-edge-canary:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Checkout CMVP source
        uses: actions/checkout@v4

      - name: Invoke deployed trial Edge Function
        shell: pwsh
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_qdnFzTsdMkK_SI5x8Mvbwg_BwTxlv_i
        run: ./scripts/verify-cmvp-trial-edge.ps1
